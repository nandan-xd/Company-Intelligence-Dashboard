<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Not Found - Company Intelligence Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card text-center p-5" style="max-width: 32rem; border-radius: 16px;">
        <div class="display-3 mb-3" style="color: var(--danger);">
           ⚠
        </div>
        <h2 class="h3 fw-bold mb-2 text-white">
            Company Not Found
        </h2>
        <p class="text-muted mb-4 fs-5">
            The company may not be supported by the current API provider or is located outside the US.
        </p>
        <div>
            <a
                href="{{ url_for('index') }}"
                class="btn btn-primary btn-lg">
                &larr; Search Again
            </a>
        </div>
    </div>
</div>

<!-- React Bits TargetCursor Script -->
<script src="{{ url_for('static', filename='js/target-cursor.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (window.TargetCursor) {
            window.TargetCursor.init({
                targetSelector: '.btn, button, a.btn',
                cursorColor: '#38bdf8',
                cursorColorOnTarget: '#b3541e'
            });
        }
    });
</script>

</body>
</html>
