<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Company Intelligence</title>

    <!-- Theme Initialization -->
    <script>
        const storedTheme = localStorage.getItem('cid-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', storedTheme);
    </script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Unified Editorial Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>

    <!-- Minimal Editorial Navbar with Sun/Moon Switcher on Top-Left -->
    <nav class="editorial-nav">
        <div class="editorial-container d-flex justify-content-between align-items-center">
            <div class="nav-left-group">
                <button id="theme-toggle-btn" class="theme-switcher-btn" type="button" aria-label="Toggle Theme" title="Toggle Light / Dark Mode">
                    <!-- Sun Icon (displayed in dark mode) -->
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4.5" fill="currentColor" fill-opacity="0.15"></circle>
                        <line x1="12" y1="1.75" x2="12" y2="4.25"></line>
                        <line x1="12" y1="19.75" x2="12" y2="22.25"></line>
                        <line x1="4.22" y1="4.22" x2="5.99" y2="5.99"></line>
                        <line x1="18.01" y1="18.01" x2="19.78" y2="19.78"></line>
                        <line x1="1.75" y1="12" x2="4.25" y2="12"></line>
                        <line x1="19.75" y1="12" x2="22.25" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.99" y2="18.01"></line>
                        <line x1="18.01" y1="5.99" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Moon Icon (displayed in light mode) -->
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <a class="brand-anchor" href="{{ url_for('index') }}" title="Company Intelligence Dashboard">
                    <span class="brand-text">Company Intelligence Dashboard</span>
                </a>
            </div>

            <div>
                <a href="{{ url_for('index') }}" class="nav-link-editorial">
                    Guest Mode &rarr;
                </a>
            </div>
        </div>
    </nav>

    <!-- Centered Editorial Auth Panel with Smooth Entrance Animation -->
    <main class="editorial-auth-shell">
        <div class="editorial-auth-card">
            <h1 class="auth-header-title">Create Account</h1>
            <p class="auth-header-subtitle">Initialize your workspace profile to save searched company dossiers.</p>

            <form id="register-form" method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="reg-unm" class="editorial-label">Username</label>
                    <input
                        id="reg-unm"
                        class="editorial-input"
                        type="text"
                        placeholder="Choose a username"
                        name="unm"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-3">
                    <label for="reg-pass" class="editorial-label">Password</label>
                    <div class="password-wrapper-editorial">
                        <input
                            id="reg-pass"
                            class="editorial-input"
                            type="password"
                            placeholder="Create a password"
                            name="pass"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-eye-btn" id="toggle-reg-pass" title="Toggle visibility" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="reg-passw" class="editorial-label">Confirm Password</label>
                    <input
                        id="reg-passw"
                        class="editorial-input"
                        type="password"
                        placeholder="Re-enter password"
                        name="passw"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" id="reg-submit-btn" class="btn btn-primary w-100" style="padding-top: 0.75rem; padding-bottom: 0.75rem;">
                    <span class="text-roll">
                        <span>Register Account &rarr;</span>
                        <span>Register Account &rarr;</span>
                    </span>
                </button>
            </form>

            {% if message %}
            <div class="auth-error-banner" role="alert">
                {{ message }}
            </div>
            {% endif %}

            <div class="auth-links-footer">
                <div class="auth-switch-row">
                    <span>Already have an account?</span>
                    <a href="{{ url_for('login') }}" class="auth-switch-link">
                        Sign in &rarr;
                    </a>
                </div>

                <div class="auth-guest-divider">
                    <span>or continue without signing in</span>
                </div>

                <div class="auth-guest-container">
                    <a href="{{ url_for('index') }}" class="btn-guest-explore" id="guest-explore-btn">
                        <span>Explore as Guest</span>
                        <span class="guest-arrow">&rarr;</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Theme Switcher Script with React Bits Pixel Transition -->
    <script src="{{ url_for('static', filename='js/theme-switcher.js') }}"></script>

    <!-- Cursor Spark Click Animation -->
    <script src="{{ url_for('static', filename='js/spark-click.js') }}"></script>

    <!-- React Bits Crosshair Animation -->
    <script src="{{ url_for('static', filename='js/crosshair.js') }}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize Crosshair Cursor
            if (window.Crosshair) {
                window.Crosshair.init();
            }

            const toggle = document.getElementById('toggle-reg-pass');
            const pass = document.getElementById('reg-pass');
            if (toggle && pass) {
                toggle.addEventListener('click', function () {
                    pass.type = pass.type === 'password' ? 'text' : 'password';
                });
            }
        });
    </script>
</body>
</html>
