<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Company Intelligence Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card" style="width: 32rem; border-radius: 18px;">

        <div class="card-body p-5">

            <h1 class="text-center fw-bold mb-2 h2" style="color: var(--sky);">
                Create Account
            </h1>

            <p class="text-center text-muted mb-4 fs-6">
                Join Company Intelligence Dashboard
            </p>

            <form method="POST">

                <div class="mb-4">
                    <input
                        class="form-control form-control-lg"
                        type="text"
                        placeholder="Username"
                        name="unm"
                        required
                    >
                </div>

                <div class="mb-4">
                    <input
                        class="form-control form-control-lg"
                        type="password"
                        placeholder="Password"
                        name="pass"
                        required
                    >
                </div>

                <div class="mb-4">
                    <input
                        class="form-control form-control-lg"
                        type="password"
                        placeholder="Confirm Password"
                        name="passw"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100 mt-2">
                    Sign Up
                </button>

            </form>

            {% if message %}
            <p class="text-danger text-center mt-3 fs-6">
                {{ message }}
            </p>
            {% endif %}

            <hr class="my-4">

            <div class="d-flex justify-content-between align-items-center text-center fs-6">
                <a href="{{ url_for('login') }}">
                    Already have an account?
                </a>
                <a href="{{ url_for('index') }}" class="text-muted">
                    Guest Mode &rarr;
                </a>
            </div>

        </div>

    </div>

</div>

<!-- React Bits TargetCursor Script -->
<script src="{{ url_for('static', filename='js/target-cursor.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (window.TargetCursor) {
            window.TargetCursor.init({
                targetSelector: '.btn, button, a.btn, input[type="submit"]',
                cursorColor: '#38bdf8',
                cursorColorOnTarget: '#b3541e'
            });
        }
    });
</script>

</body>
</html>
