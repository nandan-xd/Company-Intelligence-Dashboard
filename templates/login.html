<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    :root {
        --sky: #55aee8;
        --sky-dark: #3f97d3;
        --orange: #f4a261;
        --orange-dark: #df8848;
        --danger: #e98272;
        --ink: #111111;
        --page: #ffffff;
    }

    html, body {
        background: var(--page) !important;
        color: var(--ink);
    }

    /* Clean, consistent square action buttons */
    .btn {
        border-radius: 4px !important;
        border-width: 1px !important;
        font-weight: 600 !important;
        letter-spacing: .1px;
        box-shadow: 4px 5px 0 var(--ink) !important;
        transition:
            transform .16s ease,
            box-shadow .16s ease,
            background-color .16s ease,
            border-color .16s ease;
    }

    .btn:hover {
        transform: translateY(-5px);
        box-shadow: 5px 10px 0 var(--ink) !important;
    }

    .btn:active {
        transform: translateY(1px);
        box-shadow: 2px 2px 0 var(--ink) !important;
    }

    .btn:focus-visible {
        outline: 3px solid rgba(85, 174, 232, .35);
        outline-offset: 3px;
    }

    /* Matte sky-blue primary actions */
    .btn-primary,
    .btn-success {
        background: var(--sky) !important;
        border-color: var(--sky) !important;
        color: #07131d !important;
    }

    .btn-primary:hover,
    .btn-success:hover {
        background: var(--sky-dark) !important;
        border-color: var(--sky-dark) !important;
        color: #ffffff !important;
    }

    /* Matte orange secondary / navigation actions */
    .btn-warning,
    .btn-danger {
        background: var(--orange) !important;
        border-color: var(--orange) !important;
        color: #17100a !important;
    }

    .btn-warning:hover,
    .btn-danger:hover {
        background: var(--orange-dark) !important;
        border-color: var(--orange-dark) !important;
        color: #ffffff !important;
    }

    /* Outline buttons keep the same palette */
    .btn-outline-light,
    .btn-outline-secondary {
        background: #ffffff !important;
        border-color: var(--sky) !important;
        color: #111111 !important;
    }

    .btn-outline-light:hover,
    .btn-outline-secondary:hover {
        background: var(--sky) !important;
        border-color: var(--sky) !important;
        color: #07131d !important;
    }

    /* Make the dashboard navbar feel like the rest of the UI */
    .navbar.bg-dark {
        background: #ffffff !important;
    }

    .navbar-dark .navbar-brand {
        color: #111111 !important;
    }

    /* Subtle square accent for inputs */
    .form-control {
        border-radius: 4px !important;
        border-color: #d7e1e8 !important;
    }

    .form-control:focus {
        border-color: var(--sky) !important;
        box-shadow: 0 0 0 .2rem rgba(85, 174, 232, .18) !important;
    }

    @media (prefers-reduced-motion: reduce) {
        .btn {
            transition: none !important;
        }
        .btn:hover,
        .btn:active {
            transform: none !important;
        }
    }
</style>


<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    html, body, button, input, textarea, select, .btn {
        font-family: 'JetBrains Mono', monospace !important;
    }
</style>

</head>
    
<body>
    <body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0" style="width: 28rem; border-radius:20px;">

        <div class="card-body p-5">

            <h1 class="text-center fw-bold mb-1">
                Welcome Back
            </h1>

            <p class="text-center text-muted mb-4">
                Company Intelligence Dashboard
            </p>

            <form method="POST">

                <input
                    class="form-control form-control-lg mb-3"
                    type="text"
                    placeholder="Username"
                    name="unm"
                >

                <input
                    class="form-control form-control-lg mb-3"
                    type="password"
                    placeholder="Password"
                    name="pass"
                >

                <button
                    class="btn btn-primary btn-lg w-100">
                    Login
                </button>

            </form>

            <p class="text-danger text-center mt-3">
                {{ message }}
            </p>

            <hr>

            <div class="text-center">

                <a href="{{ url_for('register') }}">
                    Create New Account
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</body>
</html>
